
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 학습 관리</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background: #f3f6fc;
    color: #263248;
    max-width: 680px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  h1 { text-align: center; }
  .subtitle { text-align: center; color: #68758a; }

  .card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin: 18px 0;
    box-shadow: 0 3px 14px #17255410;
  }

  .progress {
    background: #e4e9f2;
    height: 14px;
    border-radius: 20px;
    overflow: hidden;
    margin: 12px 0;
  }

  #progressBar {
    height: 100%;
    width: 0;
    background: #4776e6;
    transition: width .3s;
  }

  .input-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccd4e0;
    border-radius: 8px;
    font-size: 16px;
  }

  button {
    padding: 11px 15px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
  }

  .add-btn {
    background: #4776e6;
    color: white;
  }

  #taskList {
    list-style: none;
    padding: 0;
  }

  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 0;
    border-bottom: 1px solid #edf0f5;
  }

  .task span {
    flex: 1;
    overflow-wrap: anywhere;
  }

  .task.done span {
    text-decoration: line-through;
    color: #8993a4;
  }

  .delete-btn {
    background: #fff0f0;
    color: #c13c3c;
  }

  .reset-btn {
    background: #e9edf5;
    color: #43516a;
  }

  .actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  #message { color: #4776e6; }
</style>
</head>

<body>
  <h1>📚 나의 학습 관리</h1>
  <p class="subtitle">오늘의 공부를 하나씩 완료해 보세요!</p>

  <section class="card">
    <h2>오늘의 학습 진도</h2>
    <div class="actions">
      <span>전체 완료율</span>
      <strong id="percent">0%</strong>
    </div>
    <div class="progress">
      <div id="progressBar"></div>
    </div>
    <p id="summary">0개 중 0개 완료</p>
  </section>

  <section class="card">
    <h2>새로운 학습 추가</h2>
    <form id="taskForm" class="input-row">
      <input
        id="taskInput"
        type="text"
        placeholder="예: 수학 문제 20개 풀기"
        maxlength="120"
        required
      >
      <button class="add-btn" type="submit">추가</button>
    </form>
    <p id="message" aria-live="polite"></p>
  </section>

  <section class="card">
    <h2>학습 목록</h2>
    <ul id="taskList"></ul>
    <div class="actions">
      <small>체크하면 완료 처리됩니다.</small>
      <button class="reset-btn" id="clearDone">
        완료 항목 지우기
      </button>
    </div>
  </section>

<script>
  const STORAGE_KEY = "my-study-tracker-v1";

  let tasks = [];

  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

    if (Array.isArray(saved)) {
      tasks = saved.filter(
        task =>
          task &&
          typeof task.id === "string" &&
          typeof task.title === "string" &&
          typeof task.done === "boolean"
      );
    }
  } catch (error) {
    tasks = [];
  }

  const form = document.getElementById("taskForm");
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");
  const message = document.getElementById("message");

  function saveTasks() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(tasks)
      );
      return true;
    } catch (error) {
      message.textContent =
        "저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.";
      return false;
    }
  }

  function render() {
    list.replaceChildren();

    tasks.forEach(task => {
      const item = document.createElement("li");
      item.className = "task" + (task.done ? " done" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.setAttribute(
        "aria-label",
        task.title + " 완료 여부"
      );

      checkbox.addEventListener("change", () => {
        task.done = checkbox.checked;
        saveTasks();
        render();
      });

      const title = document.createElement("span");
      title.textContent = task.title;

      const remove = document.createElement("button");
      remove.className = "delete-btn";
      remove.textContent = "삭제";
      remove.setAttribute("aria-label", task.title + " 삭제");

      remove.addEventListener("click", () => {
        tasks = tasks.filter(t => t.id !== task.id);
        saveTasks();
        render();
        message.textContent = "학습 항목을 삭제했습니다.";
      });

      item.append(checkbox, title, remove);
      list.appendChild(item);
    });

    const total = tasks.length;
    const completed = tasks.filter(t => t.done).length;
    const percent = total
      ? Math.round(completed / total * 100)
      : 0;

    document.getElementById("percent").textContent =
      percent + "%";

    document.getElementById("progressBar").style.width =
      percent + "%";

    document.getElementById("summary").textContent =
      `${total}개 중 ${completed}개 완료`;

    if (total > 0 && completed === total) {
      message.textContent = "🎉 오늘의 학습을 모두 완료했어요!";
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();

    const title = input.value.trim();

    if (!title) return;

    tasks.push({
      id: Date.now().toString() +
          Math.random().toString(36).slice(2),
      title,
      done: false
    });

    saveTasks();
    input.value = "";
    message.textContent = "새 학습 항목을 추가했습니다.";
    render();
    input.focus();
  });

  document.getElementById("clearDone").addEventListener(
    "click",
    () => {
      const completedCount = tasks.filter(t => t.done).length;

      if (completedCount === 0) {
        message.textContent = "삭제할 완료 항목이 없습니다.";
        return;
      }

      tasks = tasks.filter(t => !t.done);
      saveTasks();
      render();
      message.textContent = "완료 항목을 정리했습니다.";
    }
  );

  render();
</script>
</body>
</html>
